name: Build and Release GO CLI

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache-dependency-path: cli/go.sum

      - name: Build uplog
        run: |
          cd cli
          mkdir -p dist

          BIN=uplog
          OUT=${BIN}-${{ matrix.os }}-${{ matrix.arch }}

          if [ "${{ matrix.os }}" = "windows" ]; then
            OUT="${OUT}.exe"
          fi

          GOOS=${{ matrix.os }} \
          GOARCH=${{ matrix.arch }} \
          CGO_ENABLED=0 \
          go build -o dist/$OUT

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd cli
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes "uplog CLI release" \
            --draft=false \
            --prerelease=false || true

          gh release upload ${{ github.ref_name }} dist/* --clobber
